name: Biosignal Pipeline CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: python -m pip install ruff==0.15.22

      - name: Run Ruff Code Quality Check
        run: ruff check PipelinePython/ --config ruff.toml


  publication-audit:
    name: Publication Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit publication files and Git history
        run: python scripts/audit_public_repo.py --history

  test:
    name: Automated Test Suite (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps

      - name: Run Core Test Suite
        run: pytest PipelinePython/tests/pipeline/ PipelinePython/tests/unit/ --ignore=PipelinePython/tests/pipeline/test_anchors.py --ignore=PipelinePython/tests/pipeline/test_v3_artifact_gates.py -v --tb=short
