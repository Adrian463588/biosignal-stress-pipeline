name: Biosignal Pipeline CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: biosignal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: python -m pip install ruff==0.15.22

      - name: Run Ruff Code Quality Check
        run: ruff check PipelinePython/ --config ruff.toml

      - name: Check Ruff Formatting
        run: ruff format --check PipelinePython/ --config ruff.toml

  publication-audit:
    name: Publication Safety Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Audit publication files and Git history
        run: python scripts/audit_public_repo.py --history

  test:
    name: Automated Test Suite (Pytest)
    runs-on: ubuntu-24.04
    needs: [lint, publication-audit]
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps

      - name: Run Core Test Suite
        run: pytest PipelinePython/tests/pipeline/ PipelinePython/tests/unit/ --ignore=PipelinePython/tests/pipeline/test_anchors.py --ignore=PipelinePython/tests/pipeline/test_v3_artifact_gates.py -v --tb=short
