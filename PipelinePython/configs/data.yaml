versions:
  preprocessing: v3.1.0
  features: v4.0.0_robust_channel_independent
  model: stress_v4.0.0-core240s
timezone_local: Asia/Jakarta
random_seed: 42
raw_source:
  renamed_dir: data/raw/DataRenamedPartisipan
  trimmed_dir: data/raw/DataTrimmedPartisipan
