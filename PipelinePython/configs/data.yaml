  gold_features: data/gold/gold_features_v3.parquet
  gold_ibi_sequences: data/gold/gold_ibi_sequences_v3.parquet
  manifest: data/gold/manifest_v3.json
  reports_dir: reports
  # PipelinePaths.models_dir is the domain root; trainers add the `stress/`
